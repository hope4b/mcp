name: Request mcp PR PREPROD deploy

on:
  issue_comment:
    types:
      - created

permissions: {}

jobs:
  deploy:
    if: ${{ github.event.issue.pull_request && github.event.comment.body == '/deploy preprod' }}
    name: Request immutable PR candidate deployment
    permissions:
      actions: read
      contents: read
      pull-requests: read
      id-token: write
    uses: hope4b/onto-delivery/.github/workflows/mcp-pr-preprod-deploy.yml@e84c01dba3b6d97fdd7f5b66e48f269e4c099e19
